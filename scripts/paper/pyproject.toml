[project]
name = "automahout-paper"
version = "0.1.0"
description = "Benchmark scripts for the Automahout paper: CTC conversion, scoring, cell-scale measurement"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "imagecodecs",
    "h5py",
    "npy2bdv",
    "py-ctcmetrics==1.3.3",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false
