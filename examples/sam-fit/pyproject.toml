[project]
name = "automahout-sam-fit"
version = "0.1.0"
description = "Shape-fit server for Automahout: micro-SAM masks at detection centres over HTTP/JSON"
requires-python = "==3.12.*"
# Git sources pinned to the commits measured on 2026-10-24 (CE / HeLa / PSC silver truth).
dependencies = [
    "torch==2.14.1",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything@dca509fe793f601edb92606367a655c15ac00fdf",
    "micro_sam @ git+https://github.com/computational-cell-analytics/micro-sam@323bef4609d9644fcae45b4bd4b6b18288b9d8d1",
    "torch_em @ git+https://github.com/constantinpape/torch-em@f94980e5d2421b1c214748c7d172e473156da4ea",
    "python-elf==0.9.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "zarr<3",
    "pooch==1.9.0",
    "xxhash==4.0.2",
    "kornia==0.9.0",
    "timm==1.0.30",
    "tqdm==4.70.1",
    "imagecodecs",
    "tifffile",
    "pandas",
]

[tool.uv]
package = false
